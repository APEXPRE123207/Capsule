[package]
name = "capsule_native"
version = "0.1.0"
edition = "2021"
description = "Native Windows backend for Project Capsule"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
