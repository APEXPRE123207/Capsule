name: Build Windows Desktop App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: capsule/package-lock.json

      - name: Install Dependencies
        working-directory: capsule
        run: npm install

      - name: Run Static Syntax Checks
        working-directory: capsule
        run: npm test

      - name: Package Standalone Windows Executable
        working-directory: capsule
        run: npm run package

      - name: Package Release ZIP
        shell: powershell
        run: |
          $distDir = Resolve-Path "capsule/dist/capsule-win32-x64"
          Write-Host "Packaging release binaries from: $distDir"
          Compress-Archive -Path "$distDir\*" -DestinationPath "$pwd\capsule-windows-x64.zip" -Force
          Get-Item "$pwd\capsule-windows-x64.zip" | Format-Table Name, Length

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: capsule-windows-x64
          path: capsule-windows-x64.zip
          retention-days: 14
